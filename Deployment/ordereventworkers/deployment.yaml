apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerceflow-ordereventworkers
  namespace: commerceflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commerceflow-ordereventworkers
  template:
    metadata:
      labels:
        app: commerceflow-ordereventworkers
    spec:
      nodeSelector:
        kubernetes.io/hostname: minikube # Garante que o Pod seja agendado no n� espec�fico
      containers:
        - name: commerceflow-ordereventworkers
          image: lucasfogliarini/commerceflow-ordereventworkers:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "0.4"
              memory: "0.5Gi"
            limits:
              cpu: "0.8"
              memory: "1Gi"
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
          envFrom:
            - secretRef:
                name: commerceflow-secrets

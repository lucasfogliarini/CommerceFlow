apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-eventworkers
  namespace: commerceflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-eventworkers
  template:
    metadata:
      labels:
        app: orders-eventworkers
    spec:
      containers:
        - name: orders-eventworkers
          image: lucasfogliarini/orders-eventworkers:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "0.4"
              memory: "0.5Gi"
            limits:
              cpu: "0.8"
              memory: "1Gi"
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
          envFrom:
            - secretRef:
                name: commerceflow-secrets

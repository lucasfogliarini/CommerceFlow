apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders-eventworkers
  namespace: commerceflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders-eventworkers
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70